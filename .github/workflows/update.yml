name: Update configs

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Xray-core
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -sL -o "$RUNNER_TEMP/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          echo "XRAY_PATH=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Test configs
        run: python main.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arashonline.txt
          git diff --staged --quiet || git commit -m "Update configs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
